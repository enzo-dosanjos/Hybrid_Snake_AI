name: Tests

on:
  push:
    branches: [main, refactoring]
  pull_request:
    branches: [main, refactoring]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: All tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build executables
        run: make all
      - name: Run component suites
        run: make test
